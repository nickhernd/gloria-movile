<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clasificador de Peces</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>
    <!-- Header -->
    <nav class="navbar">
        <div class="container">
            <div class="d-flex justify-content-between w-100 align-items-center">
                <div>
                    <img src="{{ url_for('static', filename='images/gloria.png') }}" alt="Top Image 1" class="gloria-logo">
                    <img src="{{ url_for('static', filename='images/universitat_alacant.png') }}" alt="Top Image 2" class="universidad-logo">
                </div>
                <span class="navbar-brand mb-0 h1">
                    Clasificador de Peces
                </span>
                <div></div>
            </div>
        </div>
    </nav>

    <div class="container py-3">
        <!-- Main Card -->
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="main-card card border-0 shadow-lg">
                    <div class="card-body p-5">
                        <!-- Instructions -->
                        <div class="text-center mb-4">
                            <h2 class="mb-3">Identifica tu pez</h2>
                            <p class="text-muted">
                                Sube una foto de un pez para identificar su especie y origen automáticamente
                            </p>
                        </div>

                        <!-- Action Buttons -->
                        <div class="action-buttons mb-4">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <input type="file" id="imageUpload" accept="image/*" style="display: none;">
                                    <label for="imageUpload" class="btn btn-lg w-100 btn-action">
                                        Seleccionar Imagen
                                    </label>
                                </div>
                                <div class="col-md-6">
                                    <button id="cameraButton" class="btn btn-lg w-100 btn-action">
                                        Usar Cámara
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- Image Preview -->
                        <div class="image-preview-container" style="position: relative;">
                            <video id="videoFeed" autoplay playsinline class="preview-media"></video>
                            <canvas id="canvas" class="preview-media"></canvas>
                            <img id="previewImage" src="#" alt="Vista previa" class="preview-media">

                            <!-- Overlay de detección en tiempo real (DESACTIVADO) -->
                            <!-- <div id="realtimeOverlay" class="realtime-overlay">
                                <div class="overlay-content"></div>
                            </div> -->
                            <div id="realtimeOverlay" class="realtime-overlay" style="display:none !important;">
                                <div class="overlay-content"></div>
                            </div>
                        </div>

                        <!-- Action Buttons -->
                        <div class="text-center mt-4">
                            <button id="classifyButton" class="btn btn-lg px-4 classify-btn">
                                Analizar
                            </button>
                            <!-- Botón de detección en vivo (DESACTIVADO)
                            <button id="realtimeButton" class="btn btn-lg px-4 realtime-btn">
                                <i class="bi bi-camera-video"></i>
                                Detección en Vivo
                            </button>
                            -->
                            <!-- Elemento oculto para evitar errores en JS -->
                            <button id="realtimeButton" style="display:none !important;"></button>
                            <button id="autoCaptureButton" class="btn btn-lg px-4 autocapture-btn" style="display: none;">
                                <i class="bi bi-magic"></i>
                                Auto-Captura
                            </button>
                        </div>

                        <!-- Grad-CAM Toggle -->
                        <div class="text-center mt-3">
                            <div class="form-check form-switch d-inline-block">
                                <input class="form-check-input" type="checkbox" id="gradcamToggle">
                                <label class="form-check-label" for="gradcamToggle">
                                    <i class="bi bi-binoculars"></i> Mostrar Explicabilidad (Grad-CAM)
                                </label>
                            </div>
                            <small class="d-block text-muted mt-1">Visualiza qué partes de la imagen influyeron en la decisión del modelo</small>
                        </div>
                    </div>
                </div>

                <!-- Loading -->
                <div id="loading" class="status-card card mt-4">
                    <div class="card-body">
                        <div class="d-flex align-items-center">
                            <div class="spinner-border text-primary me-3" role="status"></div>
                            <div>
                                <strong>Analizando...</strong>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Error -->
                <div id="error" class="status-card card mt-4 border-start border-danger border-4">
                    <div class="card-body">
                        <div class="d-flex align-items-start">
                            <i class="bi bi-exclamation-circle text-danger me-3"></i>
                            <div>
                                <strong class="text-danger">Error</strong>
                                <p id="errorMessage" class="mb-0 mt-1"></p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Historial -->
                <div id="historySection" class="card mt-4 border-0 shadow">
                    <div class="card-body">
                        <h5 class="mb-3">
                            <i class="bi bi-clock-history"></i> Historial de Predicciones
                        </h5>
                        <div id="historyContainer"></div>
                    </div>
                </div>

                <!-- Results Modal -->
                <div id="results" class="results-modal">
                    <div class="modal-overlay"></div>
                    <div class="modal-content">
                        <button class="modal-close" id="closeModal">
                            <i class="bi bi-x-lg"></i>
                        </button>
                        <div class="modal-body">
                            <!-- Imagen del pez -->
                            <div class="modal-image-container">
                                <img id="modalImage" src="" alt="Pez analizado" class="modal-image">
                            </div>

                            <!-- Resultado principal -->
                            <div id="mainResult" class="modal-main-result"></div>

                            <!-- Grid de información 2x2 -->
                            <div id="detailedInfo" class="modal-info-grid"></div>

                            <!-- Métricas compactas -->
                            <div class="modal-metrics">
                                <div id="probabilities"></div>
                            </div>

                            <!-- Grad-CAM Section -->
                            <div id="gradcamSection" style="display: none;"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-center py-4">
        <!-- Logos para escritorio -->
        <div class="footer-logos footer-desktop">
            <img src="{{ url_for('static', filename='images/eut.jpg') }}" alt="EUT" class="footer-logo">
            <img src="{{ url_for('static', filename='images/fondos_europeos.jpg') }}" alt="Fondos Europeos" class="footer-logo footer-logo-fondos">
            <img src="{{ url_for('static', filename='images/pablo_de_olivade.jpg') }}" alt="Pablo de Olavide" class="footer-logo">
        </div>
        <!-- Logos para móvil (separados) -->
        <div class="footer-logos footer-mobile">
            <img src="{{ url_for('static', filename='images/eut.jpg') }}" alt="EUT" class="footer-logo">
            <img src="{{ url_for('static', filename='images/fondos_europeos1.png') }}" alt="Fondos Europeos 1" class="footer-logo">
            <img src="{{ url_for('static', filename='images/fondos_europeos2.png') }}" alt="Fondos Europeos 2" class="footer-logo">
            <img src="{{ url_for('static', filename='images/fondos_europeos3.png') }}" alt="Fondos Europeos 3" class="footer-logo">
            <img src="{{ url_for('static', filename='images/pablo_de_olivade.jpg') }}" alt="Pablo de Olavide" class="footer-logo">
        </div>
        <p class="text-muted small mb-0 mt-3">
            Clasificación basada en IA
        </p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
